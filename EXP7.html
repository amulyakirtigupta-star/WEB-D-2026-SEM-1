# Navigation Menu Using Lists

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 7 - Navigation Menu</title>
    <style>
        nav ul { list-style-type: none; margin: 0; padding: 0; background-color: #333; overflow: hidden; }
        nav li { float: left; }
        nav li a { display: block; color: white; text-align: center; padding: 14px 16px; text-decoration: none; }
        nav li a:hover { background-color: #111; }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#courses">Courses</a></li>
            <li><a href="#about">About Us</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>
</body>
</html>
