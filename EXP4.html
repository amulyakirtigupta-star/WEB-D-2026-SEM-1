# Semantic and Non-Semantic Elements

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 4 - Semantic vs Non-Semantic</title>
</head>
<body>
    <!-- Semantic Elements: Clearly describe their meaning -->
    <header>
        <h1>My Tech Blog</h1>
        <nav>Home | Articles | Contact</nav>
    </header>

    <main>
        <section>
            <article>
                <h2>Understanding HTML5</h2>
                <p>Semantic tags improve SEO and accessibility.</p>
            </article>
        </section>
        <aside>
            <p>Related Links: CSS3, JavaScript</p>
        </aside>
    </main>

    <!-- Non-Semantic Elements: Tell nothing about their content -->
    <div>
        <span>Generic container using div and span.</span>
    </div>

    <footer>
        <p>&copy; 2026 Tech Blog</p>
    </footer>
</body>
</html>
