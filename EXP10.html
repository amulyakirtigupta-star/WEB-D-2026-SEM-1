# Multimedia: Image, Video, Audio and YouTube

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 10 - Multimedia</title>
</head>
<body>
    <h2>Image with Figure Caption</h2>
    <figure>
        <img src="https://placeholder.com" alt="Workshop Banner">
        <figcaption>Fig 1. Web Designing Workshop Banner</figcaption>
    </figure>

    <h2>Audio Player</h2>
    <audio controls>
        <source src="sample.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <h2>Video Player</h2>
    <video width="320" height="240" controls poster="https://placeholder.com">
        <source src="sample.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <h2>Embedded YouTube Video</h2>
    <iframe width="420" height="235" src="https://youtube.com" title="HTML Tutorial" frameborder="0" allowfullscreen></iframe>
</body>
</html>
