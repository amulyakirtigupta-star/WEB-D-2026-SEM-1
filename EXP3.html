# Block and Inline Elements

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 3 - Block vs Inline</title>
</head>
<body>
    <!-- Block-level elements start on a new line and take full width -->
    <div style="border: 1px solid blue; margin-bottom: 10px;">
        <h2>This is a Block-level div</h2>
        <p>Paragraphs are also block elements.</p>
    </div>

    <!-- Inline elements stay on the same line and take only required width -->
    <p>
        This sentence contains <span style="color: red; font-weight: bold;">an inline span element</span>, 
        a <a href="#">link</a>, and <code>inline code</code> without breaking the line.
    </p>
</body>
</html>
