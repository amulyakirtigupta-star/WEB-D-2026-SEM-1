# HTML Page Structure and Comments.

<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Metadata section: contains character set, viewport, and page title -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 1 - HTML Structure</title>
</head>
<body>
    <!-- Main visible content goes inside the body tag -->
    <h1>Welcome to Web Designing Workshop</h1>
    <p>This is a standard HTML5 boilerplate structure.</p>
</body>
</html>
