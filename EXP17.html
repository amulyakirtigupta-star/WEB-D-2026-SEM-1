# Form Attributes and Input Validation

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 17 - Form Validation</title>
</head>
<body>
    <form action="#" method="post">
        <label for="college">College Code (Read-only):</label>
        <input type="text" id="college" value="ENG-2026" readonly><br><br>

        <label for="username">Username (Required, 4-12 chars):</label>
        <input type="text" id="username" name="username" required minlength="4" maxlength="12" placeholder="e.g. rahul123"><br><br>

        <label for="phone">10-Digit Mobile Number:</label>
        <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" required placeholder="9876543210"><br><br>

        <label for="marks">12th Percentage (50 - 100):</label>
        <input type="number" id="marks" name="marks" min="50" max="100" required><br><br>

        <button type="submit">Validate & Submit</button>
    </form>
</body>
</html>
