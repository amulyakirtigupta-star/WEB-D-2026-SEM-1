<!DOCTYPE html>

<head>
    <title>HTML Symbols</title>
</head>
<body>
    
    <h2>HTML Special Symbols</h2>

    <p>Copywrite: &copy;</p>
    <p>Registered: &reg;</p>
    <p>Trademark:&trade;</p>
    <p>Ruppee:&trade;</p>
    <p>Degree:&deg;</p>
    <p>Plus or Minus: &plusmn;</p>
    <p>Not Equal: &ne;</p>
    <p>Infinity: &infin;</p>
    <p>Right Arrow: &rarr;</p> 
    <p>Heart: &hearts:</p>
