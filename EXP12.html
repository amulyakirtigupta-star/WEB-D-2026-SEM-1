# Table with Headers, Caption and Footer

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 12 - Structured Table</title>
</head>
<body>
    <table border="1" cellpadding="8" cellspacing="0">
        <caption><b>Student Marks Sheet - Semester 1</b></caption>
        <thead>
            <tr>
                <th>Roll No</th>
                <th>Subject</th>
                <th>Marks</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>101</td>
                <td>Web Designing</td>
                <td>92</td>
            </tr>
            <tr>
                <td>102</td>
                <td>Programming in C</td>
                <td>88</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="2"><b>Total Marks</b></td>
                <td><b>180</b></td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
